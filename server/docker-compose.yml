version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: luxestay-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-luxestay}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=5", "-c", "max_wal_senders=5"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luxestay-network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: luxestay-pgbouncer
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-luxestay}
      PGBOUNCER_PORT: 6432
      AUTH_TYPE: md5
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - luxestay-network

  redis:
    image: redis:latest
    container_name: luxestay-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luxestay-network

  minio:
    image: minio/minio:latest
    container_name: luxestay-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - luxestay-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: luxestay-mail
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - luxestay-network

  clamav:
    image: clamav/clamav:latest
    container_name: luxestay-scanner
    networks:
      - luxestay-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luxestay-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@pgbouncer:6432/${DB_NAME:-luxestay}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - luxestay-network

networks:
  luxestay-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
